<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar watering alarm: 3D view</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  /* White background in every colour scheme (user, 2026-11-23). */
  html, body { margin: 0; height: 100%; background: #fff; font-family: system-ui, sans-serif; color: #222; }
  model-viewer { width: 100%; height: 100%; background: #fff; }
  .note { position: fixed; left: 16px; bottom: 14px; font-size: 14px; background: rgba(255,255,255,.85); padding: 6px 10px; border-radius: 6px; border: 1px solid #ddd; }
</style>
</head>
<body>
<model-viewer id="mv" src="solar_alarm.glb" alt="3D model of the solar watering alarm circuit board"
  camera-controls touch-action="pan-y" auto-rotate auto-rotate-delay="1500" rotation-per-second="20deg"
  camera-orbit="35deg 60deg auto" shadow-intensity="0.5" exposure="0.85" tone-mapping="commerce" interaction-prompt="none"></model-viewer>
<div class="note">Drag to rotate · scroll or pinch to zoom · two fingers or right-drag to move</div>
<script>
  // KiCad's export does not carry the board's real finishes, so three materials are corrected here.
  // Each is found by the colour KiCad gives it, since the export does not name them.
  //  - Coverlay: dark, colourless and partly see-through. Made opaque, matt black, or it reads grey.
  //  - Exposed copper (pads and the logo's leaf): mid grey. The board is ENIG, so it is gold.
  //  - Silkscreen: near white. Lit from within, so it is as white on the underside as on top.
  document.getElementById("mv").addEventListener("load", (e) => {
    for (const m of e.target.model.materials) {
      const pbr = m.pbrMetallicRoughness;
      const [r, g, b, a] = pbr.baseColorFactor;
      const hi = Math.max(r, g, b), lo = Math.min(r, g, b), grey = hi - lo < 0.03;
      if (grey && hi < 0.3 && a < 0.99) {                              // coverlay
        m.setAlphaMode("OPAQUE");
        pbr.setBaseColorFactor([0, 0, 0, 1]);
        pbr.setMetallicFactor(0);
        pbr.setRoughnessFactor(1);
      } else if (grey && Math.abs(hi - 0.5) < 0.03 && pbr.metallicFactor > 0.5) {   // exposed copper: ENIG gold
        pbr.setBaseColorFactor([0.92, 0.7, 0.24, 1]);
        pbr.setRoughnessFactor(0.4);
      } else if (grey && lo > 0.9 && pbr.metallicFactor < 0.5) {       // silkscreen
        pbr.setBaseColorFactor([1, 1, 1, 1]);
        m.setEmissiveFactor([0.85, 0.85, 0.85]);
      }
    }
  });
</script>
</body>
</html>
